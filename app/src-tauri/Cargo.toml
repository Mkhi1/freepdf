[package]
name = "free-pdf"
version = "0.1.3"
description = "Free offline PDF tools"
edition = "2021"
rust-version = "1.77"

[lib]
name = "free_pdf_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"

[profile.dev]
debug = 0
incremental = true

[profile.dev.package.blake3]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.blake3]
opt-level = 3
